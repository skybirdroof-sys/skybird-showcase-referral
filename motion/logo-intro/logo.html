<!doctype html>
<!--
  Skybird logo intro / outro. The whole animation is one function, render(t),
  so a recorder can step it frame by frame (see render.mjs) and a browser can
  just play it. Open logo.html?mode=intro or ?mode=outro to preview live.
-->
<html>
<head>
<meta charset="utf-8">
<title>Skybird Logo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #logo { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  #logo img { position: absolute; display: block; will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage"><div id="logo"></div></div>
<script>
// Layer boxes in the 1310x1309 source, written by split_layers.py.
const PARTS = [
  { name: "hawk", x: 740, y: 405, w: 510, h: 235 },
  { name: "script", x: 60, y: 440, w: 1090, h: 460 },
  { name: "roofing_0", x: 585, y: 820, w: 68, h: 80 },
  { name: "roofing_1", x: 657, y: 820, w: 75, h: 80 },
  { name: "roofing_2", x: 738, y: 820, w: 75, h: 80 },
  { name: "roofing_3", x: 822, y: 820, w: 62, h: 80 },
  { name: "roofing_4", x: 892, y: 820, w: 19, h: 80 },
  { name: "roofing_5", x: 923, y: 820, w: 66, h: 80 },
  { name: "roofing_6", x: 998, y: 820, w: 69, h: 80 },
];
// Visible ink of the whole logo, used to centre and size it on screen.
const INK = { x0: 67, x1: 1243, y0: 417, y1: 893 };

const params = new URLSearchParams(location.search);
const MODE = params.get("mode") || "intro";
const DURATION = { intro: 3.6, outro: 3.2 }[MODE];

const logo = document.getElementById("logo");
const el = {};
for (const p of PARTS) {
  const img = document.createElement("img");
  img.src = `layers/${p.name}.png`;
  Object.assign(img.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px", height: p.h + "px" });
  logo.appendChild(img);
  el[p.name] = img;
}
const letters = PARTS.filter(p => p.name.startsWith("roofing_")).map(p => el[p.name]);

// ---- timing helpers ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const span = (t, t0, t1) => clamp((t - t0) / (t1 - t0));      // 0..1 progress of t within [t0, t1]
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inCubic = k => k * k * k;
const inOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outBack = k => { const c = 1.25; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

function layout() {
  const W = innerWidth, H = innerHeight;
  const inkW = INK.x1 - INK.x0;
  const s = (W * 0.82) / inkW;
  const cx = (INK.x0 + INK.x1) / 2, cy = (INK.y0 + INK.y1) / 2;
  return { s, cx, cy };
}

// Hawk pivot (its body) in source coords: flaps squash around this point.
const HAWK_PIVOT = { x: 935 - 740, y: 540 - 405 };

function setHawk({ dx = 0, dy = 0, rot = 0, scale = 1, flap = 1, opacity = 1 }) {
  const h = el.hawk;
  h.style.transformOrigin = `${HAWK_PIVOT.x}px ${HAWK_PIVOT.y}px`;
  h.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${scale}, ${scale * flap})`;
  h.style.opacity = opacity;
}

// Soft-edged left-to-right wipe. `from`/`to` are 0..1 across the script's width.
function setScriptWipe(from, to) {
  const f = 6; // feather, % of width
  const a = from * (100 + 2 * f) - f, b = to * (100 + 2 * f) - f;
  const g = `linear-gradient(90deg, transparent ${a - f}%, #000 ${a}%, #000 ${b}%, transparent ${b + f}%)`;
  el.script.style.webkitMaskImage = g;
  el.script.style.maskImage = g;
}

// Wing beats: squash the hawk vertically `beats` times over the progress k, fading out as it lands.
const flapAt = (k, beats, depth) => 1 - depth * (1 - k) * Math.abs(Math.sin(Math.PI * beats * k));

function renderIntro(t) {
  // 0.00-1.05  hawk swoops in from the top right, beating its wings, and lands
  const kf = span(t, 0.0, 1.05), e = outCubic(kf);
  setHawk({
    dx: lerp(620, 0, e), dy: lerp(-760, 0, e) + Math.sin(kf * Math.PI) * -40,
    rot: lerp(-28, 0, e), scale: lerp(1.9, 1, e),
    flap: flapAt(kf, 3, 0.55), opacity: clamp(kf * 6),
  });
  // Tiny settle as it lands.
  const land = span(t, 1.05, 1.35);
  if (land > 0) setHawk({ flap: 1 - 0.08 * Math.sin(Math.PI * land), dy: 6 * Math.sin(Math.PI * land) });

  // 0.40-1.65  "Skybird" writes on left to right
  setScriptWipe(0, inOutCubic(span(t, 0.40, 1.65)));

  // 1.45-2.35  ROOFING letters rise in one after another
  letters.forEach((l, i) => {
    const k = span(t, 1.45 + i * 0.07, 1.45 + i * 0.07 + 0.42);
    l.style.opacity = outCubic(k);
    l.style.transform = `translateY(${lerp(46, 0, outBack(k))}px)`;
  });

  // Whole logo: gentle push-in for the full clip
  return 1 + 0.035 * inOutCubic(span(t, 0, DURATION));
}

function renderOutro(t) {
  // 0.00-1.10  logo rests, slow push-in
  // 1.00-1.25  hawk crouches, then 1.25-2.20 takes off up and to the right
  const crouch = span(t, 1.0, 1.25);
  const kf = span(t, 1.25, 2.2), e = inCubic(kf);
  setHawk({
    dx: lerp(0, 760, e), dy: lerp(0, -820, e) + 10 * Math.sin(Math.PI * crouch) * (kf === 0 ? 1 : 0),
    rot: lerp(0, -24, e), scale: lerp(1, 1.8, e),
    flap: kf > 0 ? 1 - 0.55 * Math.abs(Math.sin(Math.PI * 3.5 * kf)) : 1 - 0.1 * Math.sin(Math.PI * crouch),
    opacity: 1 - span(kf, 0.8, 1),
  });

  // 1.45-2.30  ROOFING drops away, first letter first
  letters.forEach((l, i) => {
    const k = inCubic(span(t, 1.45 + i * 0.05, 1.45 + i * 0.05 + 0.35));
    l.style.opacity = 1 - k;
    l.style.transform = `translateY(${lerp(0, 40, k)}px)`;
  });

  // 1.55-2.55  "Skybird" wipes away left to right, following the hawk
  setScriptWipe(inOutCubic(span(t, 1.55, 2.55)), 1);

  return 1.02 + 0.03 * inOutCubic(span(t, 0, 2.6));
}

window.render = function (t) {
  const zoom = MODE === "outro" ? renderOutro(t) : renderIntro(t);
  const { s, cx, cy } = layout();
  logo.style.transform = `scale(${s * zoom}) translate(${-cx}px, ${-cy}px)`;
};
window.DURATION = DURATION;
window.ready = Promise.all([...logo.querySelectorAll("img")].map(i => i.decode()));

// Live preview when opened directly (the recorder sets ?record=1 and drives time itself).
if (!params.has("record")) {
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % (DURATION + 0.8)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  render(0);
}
</script>
</body>
</html>
