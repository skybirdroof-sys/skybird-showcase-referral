<!doctype html>
<!--
  Skybird logo intro / outro. The whole animation is one function, render(t),
  so a recorder can step it frame by frame (see render.mjs) and a browser can
  just play it. Serve this folder (python3 -m http.server) and open
  logo.html?mode=intro or ?mode=outro to preview live.
-->
<html>
<head>
<meta charset="utf-8">
<title>Skybird Logo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #logo { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  #logo img, #logo canvas, #hawk { position: absolute; display: block; }
  #hawk img { position: absolute; display: block; }
</style>
</head>
<body>
<div id="stage"><div id="logo"></div></div>
<script type="module">
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") || "intro";
const DURATION = { intro: 3.8, outro: 3.0 }[MODE];

// Visible ink of the whole logo, used to centre and size it on screen.
const INK = { x0: 67, x1: 1243, y0: 417, y1: 893 };
// Shoulder pivots in source-image coordinates; wings turn about these.
const FAR_SHOULDER = { x: 947, y: 505 };
const NEAR_SHOULDER = { x: 1030, y: 512 };

const { parts, rig } = await (await fetch("layers/layers.json")).json();
const box = Object.fromEntries([...parts, ...rig].map(p => [p.name, p]));
const logo = document.getElementById("logo");
const place = (node, p, parent = logo, ox = 0, oy = 0) => {
  Object.assign(node.style, { left: p.x - ox + "px", top: p.y - oy + "px", width: p.w + "px", height: p.h + "px" });
  parent.appendChild(node);
  return node;
};
const loadImg = src => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });

// ---- the script, as a canvas we can reveal pixel by pixel in pen order ----
const [scriptImg, timeImg] = await Promise.all([loadImg("layers/script.png"), loadImg("layers/script-time.png")]);
const S = box.script;
const scriptCanvas = place(document.createElement("canvas"), S);
scriptCanvas.width = S.w; scriptCanvas.height = S.h;
const sctx = scriptCanvas.getContext("2d");
const pixels = (img) => { const c = new OffscreenCanvas(S.w, S.h).getContext("2d"); c.drawImage(img, 0, 0); return c.getImageData(0, 0, S.w, S.h).data; };
const inkRGBA = pixels(scriptImg);
const penTime = pixels(timeImg);          // red channel: 0 = no ink, 1..255 = when the pen gets there
const frameBuf = sctx.createImageData(S.w, S.h);
const inkIdx = [];
for (let i = 0; i < penTime.length; i += 4) if (penTime[i] > 0) inkIdx.push(i);
function setWritten(p, fade = 1) {
  // p: 0..1 through the writing. A pixel fades in over ~1.5% of the writing as the pen passes.
  const soft = 4, front = 1 + p * (254 + soft), d = frameBuf.data;
  for (const i of inkIdx) {
    const k = Math.min(1, Math.max(0, (front - penTime[i]) / soft));
    d[i] = inkRGBA[i]; d[i + 1] = inkRGBA[i + 1]; d[i + 2] = inkRGBA[i + 2];
    d[i + 3] = inkRGBA[i + 3] * k * fade;
  }
  sctx.putImageData(frameBuf, 0, 0);
}

// ---- ROOFING letters ----
const letters = parts.filter(p => p.name.startsWith("roofing_")).map(p => {
  const img = new Image(); img.src = `layers/${p.name}.png`; return place(img, p);
});

// ---- the hawk: far wing behind, body, near wing in front, plus the untouched original for rest ----
const H = box.hawk;
const hawk = place(Object.assign(document.createElement("div"), { id: "hawk" }), H);
const rigImg = (name) => { const img = new Image(); img.src = `layers/${name}.png`; return place(img, box[name], hawk, H.x, H.y); };
const farWing = rigImg("hawk_farwing"), body = rigImg("hawk_body"), nearWing = rigImg("hawk_nearwing");
const hawkRest = rigImg("hawk");
farWing.style.transformOrigin = `${FAR_SHOULDER.x - box.hawk_farwing.x}px ${FAR_SHOULDER.y - box.hawk_farwing.y}px`;
nearWing.style.transformOrigin = `${NEAR_SHOULDER.x - box.hawk_nearwing.x}px ${NEAR_SHOULDER.y - box.hawk_nearwing.y}px`;
hawk.style.transformOrigin = `${(FAR_SHOULDER.x + NEAR_SHOULDER.x) / 2 - H.x}px ${NEAR_SHOULDER.y - H.y}px`;
await Promise.all([...logo.querySelectorAll("img")].map(i => i.decode()));

// ---- timing helpers ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const span = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k * k * (3 - 2 * k);
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inCubic = k => k * k * k;
const inOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outBack = k => { const c = 1.25; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

/*
  Pose the hawk. `beat` is the wing-beat phase in cycles, `amp` 0..1 how hard it is flapping
  (0 = the logo pose). Wings sweep from above the back down past the body; on the upstroke they
  partly fold (shorter span), and the body lifts a little on each downstroke.
*/
function setHawk({ x = 0, y = 0, pitch = 0, scale = 1, beat = 0, amp = 0, raise = 0, opacity = 1 }) {
  const phi = 2 * Math.PI * beat;
  const w = -Math.cos(phi);                       // -1 top of upstroke .. +1 bottom of downstroke
  const up = Math.max(0, -Math.sin(phi));         // how much it is on the upstroke
  const angle = amp * (12 + 42 * w) - raise;      // degrees, + = wing tips down
  const span = 1 - amp * (0.08 * w * w + 0.22 * up);
  const chord = 1 - amp * 0.1 * Math.max(0, w);   // wing tilts away from us at the bottom
  const lift = -amp * 7 * Math.sin(phi);
  nearWing.style.transform = `rotate(${angle}deg) scale(${span}, ${chord})`;
  farWing.style.transform = `rotate(${-angle * 0.85}deg) scale(${1 - (1 - span) * 1.1}, ${chord})`;
  hawk.style.transform = `translate(${x}px, ${y + lift}px) rotate(${pitch}deg) scale(${scale})`;
  hawk.style.opacity = opacity;
  const rest = amp === 0 && raise === 0;
  hawkRest.style.visibility = rest ? "visible" : "hidden";
  for (const n of [farWing, body, nearWing]) n.style.visibility = rest ? "hidden" : "visible";
}

function renderIntro(t) {
  // 0.00-1.25  glides down from the top right, beating hard, then sets its wings and flares to land.
  const k = span(t, 0, 1.25), e = outCubic(k);
  const amp = 1 - smooth(span(t, 0.55, 1.1));
  const pitch = lerp(-14, 0, smooth(span(t, 0.2, 0.9))) + 7 * Math.sin(Math.PI * span(t, 0.85, 1.4));
  setHawk({
    x: lerp(700, 0, e), y: lerp(-820, 0, e) - 50 * Math.sin(Math.PI * k) * (1 - k),
    pitch, scale: lerp(1.55, 1, e),
    beat: 3.3 * t, amp: t < 1.4 ? amp : 0, opacity: clamp(t * 8),
  });

  // 0.35-2.05  "Skybird" is written on, in pen order, dotting the i last.
  setWritten(span(t, 0.35, 2.05));

  // 1.95-2.85  ROOFING letters rise in one after another.
  letters.forEach((l, i) => {
    const k = span(t, 1.95 + i * 0.07, 1.95 + i * 0.07 + 0.42);
    l.style.opacity = outCubic(k);
    l.style.transform = `translateY(${lerp(46, 0, outBack(k))}px)`;
  });

  return 1 + 0.03 * inOutCubic(span(t, 0, DURATION));
}

function renderOutro(t) {
  // 0.00-0.90  logo rests. 0.90-1.15 hawk crouches and lifts its wings, then takes off up and
  // to the left, the way it faces, beating hard.
  const crouch = Math.sin(Math.PI * span(t, 0.9, 1.2));
  const k = span(t, 1.1, 2.1), e = inCubic(k);
  const flying = t >= 1.1;
  setHawk({
    x: lerp(0, -900, e), y: lerp(0, -760, e) + 8 * crouch,
    pitch: lerp(0, 10, smooth(k)) - 4 * crouch, scale: lerp(1, 1.5, e),
    beat: flying ? 3.6 * (t - 1.1) + 0.5 : 0, amp: flying ? smooth(span(t, 1.1, 1.3)) : 0,
    raise: flying ? 0 : 18 * smooth(span(t, 0.9, 1.1)),
    opacity: 1 - span(k, 0.85, 1),
  });

  // 1.35-2.10  ROOFING settles away, then the script fades up and out.
  letters.forEach((l, i) => {
    const k = inCubic(span(t, 1.35 + i * 0.04, 1.35 + i * 0.04 + 0.35));
    l.style.opacity = 1 - k;
    l.style.transform = `translateY(${lerp(0, 30, k)}px)`;
  });
  const out = smooth(span(t, 1.5, 2.2));
  setWritten(1, 1 - out);
  scriptCanvas.style.transform = `translateY(${-24 * out}px)`;

  return 1.02 + 0.02 * inOutCubic(span(t, 0, 2.2));
}

function layout() {
  const s = (innerWidth * 0.82) / (INK.x1 - INK.x0);
  return { s, cx: (INK.x0 + INK.x1) / 2, cy: (INK.y0 + INK.y1) / 2 };
}

window.render = function (t) {
  const zoom = MODE === "outro" ? renderOutro(t) : renderIntro(t);
  const { s, cx, cy } = layout();
  logo.style.transform = `scale(${s * zoom}) translate(${-cx}px, ${-cy}px)`;
};
window.DURATION = DURATION;
window.ready = true;

// Live preview when opened directly (the recorder sets ?record=1 and drives time itself).
if (!params.has("record")) {
  const t0 = performance.now();
  const loop = now => { render(((now - t0) / 1000) % (DURATION + 0.8)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  render(0);
}
</script>
</body>
</html>
