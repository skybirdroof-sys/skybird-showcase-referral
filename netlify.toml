# Talon — Skybird Roofing office TV board
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Sheet watchdog's daily run. 15:05 UTC is 11:05am Eastern on daylight time
# and 10:05am once it is not - AFTER the ops bot's morning routines rather than
# during them. At 9:05am it would have caught the Top Five tab mid-morning every
# Monday, when the newest write is still Friday evening and 64h old, and raised
# the same false alarm every week. Late enough to let the morning land, early
# enough that a routine which did not run at all is reported before the day is
# over.
#
# The schedule is on health-cron, NOT on health: Netlify refuses to serve a
# scheduled function over HTTP, so putting it on health made GET /api/health
# answer 403 - the one command anybody was told to run. Reading the report by
# hand goes to health.js, which has no schedule and never notifies.
[functions."health-cron"]
  schedule = "5 15 * * *"

[dev]
  framework = "#static"

# Secret URL path for the office TV bookmark: /t/<random>
# Any /t/* path serves the board. Pick one random path, bookmark it, and keep it off
# public pages. See README (Access control).
[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

# Level 10 scorecard page, and the same page under the secret path.
[[redirects]]
  from = "/l10"
  to = "/l10.html"
  status = 200

[[redirects]]
  from = "/t/*/l10"
  to = "/l10.html"
  status = 200

# The publish dir is the repo root, so keep source folders from being served.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 301

# Friendly API paths -> functions
[[redirects]]
  from = "/api/sheet"
  to = "/.netlify/functions/sheet"
  status = 200

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # The board is a wall display; never let a proxy cache a stale board shell.
    Cache-Control = "no-cache"
