# Talon — Skybird Roofing office TV board
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Sheet watchdog. 13:05 UTC is 9:05am Eastern while the US is on daylight
# time and 8:05am once it is not - early enough that a tab which stopped being
# written overnight is reported before the day starts. Netlify's scheduler
# invokes it as a POST, which is what makes the scheduled run the one that
# notifies while a manual GET of /api/health stays quiet.
[functions."health"]
  schedule = "5 13 * * *"

[dev]
  framework = "#static"

# Secret URL path for the office TV bookmark: /t/<random>
# Any /t/* path serves the board. Pick one random path, bookmark it, and keep it off
# public pages. See README (Access control).
[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

# Level 10 scorecard page, and the same page under the secret path.
[[redirects]]
  from = "/l10"
  to = "/l10.html"
  status = 200

[[redirects]]
  from = "/t/*/l10"
  to = "/l10.html"
  status = 200

# The publish dir is the repo root, so keep source folders from being served.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 301

# Friendly API paths -> functions
[[redirects]]
  from = "/api/sheet"
  to = "/.netlify/functions/sheet"
  status = 200

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # The board is a wall display; never let a proxy cache a stale board shell.
    Cache-Control = "no-cache"
