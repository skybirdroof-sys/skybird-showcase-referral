<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Level 10 Scorecard · Talon</title>
  <meta name="description" content="Talon — Level 10 scorecard for Skybird Roofing." />
  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/talon.css" />
  <link rel="stylesheet" href="/assets/css/l10.css" />
</head>
<body class="l10-body">
  <div id="gate" class="gate" hidden>
    <form class="gate__form" id="gate-form" autocomplete="off">
      <div class="gate__mark">TALON</div>
      <label class="gate__label" for="gate-input">Passphrase</label>
      <input class="gate__input" id="gate-input" type="password" inputmode="text"
             autocomplete="current-password" spellcheck="false" />
      <button class="gate__btn" type="submit">Unlock board</button>
      <p class="gate__msg" id="gate-msg" role="status"></p>
    </form>
  </div>

  <main id="l10" class="l10" hidden>
    <header class="l10__chrome">
      <div class="l10__title">
        <h1 class="l10__h1">Level 10 Scorecard</h1>
        <p class="l10__sub">Type these into Ninety → Leadership Team → Weekly</p>
        <p class="l10__hint" id="l10-hint">
          Click a card, or press Enter or Space on it, for the 13-week trend. Esc closes it.
        </p>
      </div>
      <div class="l10__meta">
        <span class="l10__week" id="l10-week"></span>
        <span class="badge badge--stale" id="badge-stale" hidden>feed stale</span>
        <a class="l10__back" href="/" id="l10-back">← Board</a>
      </div>
    </header>

    <div class="l10__grid" id="l10-grid"></div>

    <p class="l10__note" id="l10-note" role="status"></p>
  </main>

  <noscript>
    <p style="color:#e6f6ff;background:#05070a;font:600 20px system-ui;padding:32px">
      The Level 10 scorecard needs JavaScript enabled.
    </p>
  </noscript>

  <script type="module" src="/assets/js/l10.js"></script>
</body>
</html>
